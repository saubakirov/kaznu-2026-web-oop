[project]
name = "web-oop"
version = "0.1.0"
description = "Интерактивный мини-курс ООП для студентов КазНУ"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.0",
]

[tool.ruff]
target-version = "py312"
exclude = [
    ".tfw",
    ".git",
    "__pycache__",
    "venv",
    ".venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
